# TypeRush — configuration file
#
# `typerush --init-config` writes this file to `~/.typerush/config.toml`.
# Every value below is the built-in default, so the file changes nothing
# until you edit it. TypeRush works fine without a config file — every
# setting is optional.
#
# Change settings without opening the file: `typerush config set theme
# dracula`, the Settings screen in the app, `typerush config show` to see
# them all. Your comments are kept.
#
# Precedence: menu keys p / n / b (while open) > CLI flags > this file >
# built-in defaults.

# -----------------------------------------------------------------------------
# Theme — pick one of the built-in palettes by name.
# Available names: dark, light, monokai, dracula
# Run `typerush --list-themes` to see what's currently shipped.
# -----------------------------------------------------------------------------
theme = "dark"

# -----------------------------------------------------------------------------
# Defaults — pre-selects a menu row and sets the initial mode when no CLI flag
# is given. CLI flags (--time, --words, --quote, --code, --zen, --symbols,
# --daily) always win.
# -----------------------------------------------------------------------------
[defaults]
# Which menu row to pre-select:
#   "time" | "words" | "quote" | "code" | "zen" | "symbols" | "daily" | "missed"
mode = "time"
# Used when mode = "time". Standard menu rows: 15 / 30 / 60 / 120.
time_seconds = 15
# Used when mode = "words". Standard menu rows: 10 / 25 / 50 / 100.
word_count = 25
# Used when mode = "code". One of:
#   rust | python | js | go | java | sql | shell
code_lang = "rust"
# Used when mode = "symbols". Standard menu rows: 25 / 50.
symbol_count = 25

# -----------------------------------------------------------------------------
# Words — pick the word pool and optionally sprinkle in punctuation / numbers.
# CLI flags `--big`, `--punctuation`, `--numbers` (and `--no-big`,
# `--no-punctuation`, `--no-numbers`) override these per-launch, and the menu
# keys `p`, `n`, `b` toggle them while TypeRush is open. They apply to time and
# words modes; zen always stays plain.
# -----------------------------------------------------------------------------
# [words]
# pool = "common"        # "common" (default, ~430 frequent words) | "extended" (10,000 words)
# punctuation = false    # attach commas, periods, quotes, etc. to ~25% of words
# numbers = false        # mix in random 1–4 digit number tokens (~12% of slots)

# -----------------------------------------------------------------------------
# Typing — how a run behaves and looks while you type. The Settings screen
# changes these too; `--blind`, `--stop-on-error` and `--pace` set them for
# one launch.
# -----------------------------------------------------------------------------
# [typing]
# live_wpm = true        # show WPM and accuracy while typing
# blind = false          # no right/wrong colors while typing; numbers at the end
# stop_on_error = "off"  # "off" | "letter" (a wrong key doesn't move the cursor)
#                        #  | "word" (a word with a mistake can't be left)
# cursor = "underline"   # "underline" | "block" | "bar"
# sound = "off"          # "off" | "errors" | "keys" — the terminal's bell
# pace = "off"           # "off" | "best" (your best for the mode) | a WPM, e.g. 60

# -----------------------------------------------------------------------------
# Color overrides — applied ON TOP of the chosen theme.
# Any slot omitted here keeps the theme's value. (The values below are
# monokai's, as an example.)
# Values may be:
#   - a hex string like "#A6E22E"
#   - one of the 16 ANSI names: black, red, green, yellow, blue, magenta,
#     cyan, gray, dark_gray, light_red, light_green, light_yellow,
#     light_blue, light_magenta, light_cyan, white
# -----------------------------------------------------------------------------
# [colors]
# accent     = "#66D9EF"   # cursor, gauge, banner, time, titles
# secondary  = "#E6DB74"   # WPM number, section titles
# correct    = "#A6E22E"   # correctly-typed characters + accuracy %
# incorrect  = "#FA5892"   # wrongly-typed characters
# pending    = "#97937E"   # untyped characters + muted labels/footers
# extra      = "#FD971F"   # unused — kept so existing configs still load
# mode_tag   = "#AE81FF"   # [mode] badge in the header
# error      = "#FA5892"   # error modal border
# neutral    = "#F8F8F2"   # emphasized neutral text (char totals)
# background = "#272822"   # full-screen background fill
#                          # set to "reset" to use the terminal's native bg
