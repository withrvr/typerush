[package]
name = "typerush"
version = "0.2.0"
edition = "2021"
description = "In your terminal — a fast, cross-platform WPM typing trainer built with Rust"
license = "MIT"
repository = "https://github.com/withrvr/typerush"
keywords = ["typing", "terminal", "tui", "wpm"]
categories = ["command-line-utilities", "games"]
authors = ["Raghav Rathi", "withrvr"]
readme = "README.md"
exclude = [
    "assets/",
    "docs/",
    ".github/",
    "*.mp4",
    "*.gif",
    "*.tape",
]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "5"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
