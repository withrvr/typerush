[package]
name = "typerush"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
description = "In your terminal — a fast, cross-platform WPM typing trainer built with Rust"
license = "MIT"
repository = "https://github.com/withrvr/typerush"
keywords = ["typing", "terminal", "tui", "wpm"]
categories = ["command-line-utilities", "games"]
authors = ["Raghav Rathi", "withrvr"]
readme = "README.md"
exclude = [
    "assets/",
    "docs/",
    ".claude/",
    ".github/",
    "*.mp4",
    "*.gif",
    "*.tape",
]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
toml = "1"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
