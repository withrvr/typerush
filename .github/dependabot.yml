# Weekly pull requests for outdated crates and GitHub Actions.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its tag is the Rust version CI installs (1.88 = our MSRV), not an action version.
      - dependency-name: "dtolnay/rust-toolchain"
